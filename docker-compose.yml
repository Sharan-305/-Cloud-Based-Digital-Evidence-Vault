services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evidence_vault_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/evidence_vault_dev
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_S3_BUCKET_NAME=evidence-vault-demo-bucket
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - vault-net

  mongo:
    image: mongo:7.0
    container_name: evidence_vault_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault-net

volumes:
  mongo-data:

networks:
  vault-net:
    driver: bridge
